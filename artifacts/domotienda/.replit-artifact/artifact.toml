kind = "web"
previewPath = "/"
title = "La Domotienda — 3D"
version = "1.0.0"
id = "artifacts/domotienda"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20695

[services.development]
run = "pnpm --filter @workspace/domotienda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/domotienda", "run", "build" ]
publicDir = "artifacts/domotienda/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20695"
BASE_PATH = "/"
